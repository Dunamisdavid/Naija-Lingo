<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2A5544"/>
      <stop offset="60%" stop-color="#1B3B2F"/>
      <stop offset="100%" stop-color="#0E120E"/>
    </radialGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CB98"/>
      <stop offset="45%" stop-color="#C9A566"/>
      <stop offset="100%" stop-color="#8C6C34"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6C34"/>
      <stop offset="50%" stop-color="#E6CB98"/>
      <stop offset="100%" stop-color="#8C6C34"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- fine outer rings, echoing the original seal, for texture -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#C9A566" stroke-width="0.75" opacity="0.25"/>
  <circle cx="256" cy="256" r="186" fill="none" stroke="#C9A566" stroke-width="0.5" opacity="0.35"/>

  <!-- back speech bubble: outlined, offset lower-right -->
  <path d="M 210 215
           a 92 84 0 1 1 8 168
           l -34 30 4 -42
           a 92 84 0 0 1 22 -156 Z"
        fill="none" stroke="url(#goldLine)" stroke-width="3" opacity="0.85"/>

  <!-- front speech bubble: filled, offset upper-left -->
  <path d="M 302 148
           a 96 88 0 1 0 -6 176
           l 40 32 -6 -46
           a 96 88 0 0 0 -28 -162 Z"
        fill="url(#goldFill)"/>

  <!-- tone-mark accent above the front bubble: nods to diacritic marks central to the languages -->
  <path d="M 268 118 Q 284 96 302 108" stroke="#0E120E" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- small dot inside back bubble, suggesting a listening/response cue -->
  <circle cx="242" cy="278" r="7" fill="#0E120E" opacity="0.75"/>

  <!-- fine radiating dash marks around the seal for richness, evenly spaced -->
  <g stroke="#C9A566" stroke-width="1.5" opacity="0.4">
    <line x1="256" y1="48" x2="256" y2="64"/>
    <line x1="256" y1="448" x2="256" y2="464"/>
    <line x1="48" y1="256" x2="64" y2="256"/>
    <line x1="448" y1="256" x2="464" y2="256"/>
    <line x1="112" y1="112" x2="123" y2="123"/>
    <line x1="389" y1="389" x2="400" y2="400"/>
    <line x1="400" y1="112" x2="389" y2="123"/>
    <line x1="123" y1="389" x2="112" y2="400"/>
  </g>
</svg>
